name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Detect on the sample logs
        run: |
          python -m authsentry samples/linux_auth.log --year 2026 -o linux-report.md
          python -m authsentry samples/windows_security.json --json -o windows-report.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sample-incident-reports
          path: |
            linux-report.md
            windows-report.json
